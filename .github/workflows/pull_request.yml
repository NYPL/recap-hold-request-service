name: Pull Request
on: pull_request
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          extensions: "intl"
          ini-values: "memory_limit=-1, error_reporting=E_ALL, display_errors=On, zend_extension=xdebug"
          php-version: "8.3"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: 8.3
          version: 2.5.5

      - name: PHPUnit
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/logs/clover.xml

      - name: PHPCS
        run: vendor/bin/phpcs -n --standard=PSR1,PSR2 src/
